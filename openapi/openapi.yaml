openapi: 3.0.3
info:
  title: Badgery API
  description: >
    Multi-tenant achievement-badge platform API. Session-cookie
    authentication (not JWT) — see the auth paths below.
  version: 2.0.0
servers:
  - url: /api/v1

security:
  - cookieAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, name, email]
              properties:
                username:
                  type: string
                  minLength: 3
                password:
                  type: string
                  minLength: 6
                name:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      summary: Log in and start a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      summary: Get the current session's user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session points to a deleted user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      summary: Log out and destroy the session
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /healthz:
    get:
      summary: Health check (database connectivity)
      description: >
        Used by container/orchestrator liveness and readiness probes.
        Not versioned under /api/v1 — checked at the true application root.
      tags: [health]
      security: []
      responses:
        "200":
          description: Healthy — database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Unhealthy — database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error

  /organizations:
    get:
      summary: List organizations
      description: >
        Admins get every organization (OrganizationSummary[]); non-admins
        get only the organizations they belong to (OrganizationRef[]) — two
        different response shapes on one endpoint depending on caller role.
      tags: [organizations]
      responses:
        "200":
          description: Organizations visible to the caller
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummary"
                  - type: array
                    items:
                      $ref: "#/components/schemas/OrganizationRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create an organization
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{id}:
    get:
      summary: Get an organization by id
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Organization (full row — wider than OrganizationSummary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update an organization
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgId}/users:
    get:
      summary: List an organization's members
      tags: [organizations, users]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Members of the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgId}/categories:
    get:
      summary: List an organization's badge categories
      tags: [organizations, badges]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Badge categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeCategorySummary"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a badge category
      tags: [organizations, badges]
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeCategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgId}/stats:
    get:
      summary: Get organization-level counts
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: >
            Aggregate counts. On an internal query error this endpoint
            returns all-zeros rather than a 5xx (pre-existing, not fixed by
            this phase).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationStats"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgId}/badges:
    get:
      summary: List badges in an organization
      tags: [badges]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a badge
      tags: [badges]
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeInput"
      responses:
        "201":
          description: >
            Badge created. Returns the raw row (BadgeWriteResponse) — no
            `category` object, unlike the GET endpoints' BadgeResponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /badges/{id}:
    get:
      summary: Get a badge by id
      tags: [badges]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Badge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a badge
      tags: [badges]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeUpdateInput"
      responses:
        "200":
          description: Updated badge (raw row, same caveat as POST above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a badge
      tags: [badges]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /badges/{badgeId}/award:
    post:
      summary: Award a badge to a user
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/badgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
      responses:
        "201":
          description: Achievement created (raw row)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /badges/{badgeId}/progress/{userId}:
    get:
      summary: Get one user's progress on one badge
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/badgeId"
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: >
            Progress detail. 404s if the badge has no configured
            badgeMetrics rows — the normal case for badges created through
            the UI (see CLAUDE.md's "Badge progress persistence is broken"
            note).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeProgressDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Update a user's progress on a badge
      description: >
        Known broken: this route's request body sends a flat
        `{ progress: 0-100 }` percentage, but persistence is built around a
        per-metric model — for badges without pre-configured badgeMetrics
        rows this silently no-ops and returns null. Documented as observed,
        not fixed (see CLAUDE.md and tests/progress.test.ts).
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/badgeId"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                progress:
                  type: number
                  minimum: 0
                  maximum: 100
                progressData: {}
                notes:
                  type: string
                status:
                  type: string
      responses:
        "200":
          description: Updated progress, or null if the update silently no-op'd
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/BadgeProgressDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgId}/awarded-badges:
    get:
      summary: List badges awarded within an organization
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Awarded badges, with awarding-user names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgAwardedBadge"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{userId}/awarded-badges:
    get:
      summary: List badges awarded to a user
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: >
            Awarded badges (same shape as the org-scoped endpoint, minus
            userName)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAwardedBadge"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userId}/progress:
    get:
      summary: List a user's progress across all badges
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: >
            Per-badge progress summaries — a different shape than
            /badges/{badgeId}/progress/{userId} (flat badge fields instead
            of a nested `badge` object).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserBadgeProgressSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgId}/progress:
    get:
      summary: List all users' progress within an organization
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: >
            Per-user-per-badge summaries. `progress` is currently a
            hardcoded 0 and `status` is always "in_progress" — pre-existing,
            documented, not fixed by this phase.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgBadgeProgressSummary"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}:
    get:
      summary: Get a user's profile
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: >
            User profile — a third user-shape, distinct from
            AuthUserResponse and OrgUserResponse (see UserProfileResponse).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: integer
    badgeId:
      name: badgeId
      in: path
      required: true
      schema:
        type: integer
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string

    ValidationErrorResponse:
      type: object
      required: [message, code, errors]
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items: {}

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AuthUserResponse:
      type: object
      required: [id, username, name, email, role, organizationId]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        organizationId:
          type: integer
          nullable: true

    OrganizationRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    OrganizationSummary:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Organization:
      description: Full Drizzle row (shared/schema.ts organizations table)
      type: object
      required:
        [
          id,
          name,
          description,
          createdAt,
          createdBy,
          updatedAt,
          updatedBy,
          active,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: integer
          nullable: true
        active:
          type: boolean

    OrganizationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 5

    BadgeCategorySummary:
      type: object
      required: [id, name, organizationId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        organizationId:
          type: integer
        createdAt:
          type: string
          format: date-time

    BadgeCategory:
      description: Full Drizzle row (shared/schema.ts badgeCategories table)
      type: object
      required:
        [
          id,
          name,
          organizationId,
          createdAt,
          createdBy,
          updatedAt,
          updatedBy,
          active,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        organizationId:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: integer
          nullable: true
        active:
          type: boolean

    BadgeCategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2

    OrganizationStats:
      type: object
      required: [totalBadges, totalUsers, totalAwarded, inProgress]
      properties:
        totalBadges:
          type: integer
        totalUsers:
          type: integer
        totalAwarded:
          type: integer
        inProgress:
          type: integer

    OrgUserResponse:
      type: object
      required: [id, username, name, email, role, createdAt, organizations]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationRef"

    UserProfileResponse:
      type: object
      required: [id, username, name, email, role, organizations]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationRef"

    BadgeResponse:
      type: object
      required:
        - id
        - name
        - description
        - criteria
        - imageUrl
        - color
        - categoryId
        - organizationId
        - createdAt
        - requiresProgress
        - criteriaSections
        - criteriaType
        - category
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        criteria:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        organizationId:
          type: integer
        createdAt:
          type: string
          format: date-time
        requiresProgress:
          type: boolean
        criteriaSections: {}
        criteriaType:
          type: string
        category:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OrganizationRef"

    Badge:
      description: Full Drizzle row (shared/schema.ts badges table) — sent by POST/PUT, unlike BadgeResponse above
      type: object
      required:
        - id
        - name
        - description
        - criteria
        - imageUrl
        - color
        - categoryId
        - organizationId
        - requiresProgress
        - criteriaSections
        - criteriaType
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - active
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        criteria:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        organizationId:
          type: integer
        requiresProgress:
          type: boolean
        criteriaSections: {}
        criteriaType:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: integer
          nullable: true
        active:
          type: boolean

    BadgeInput:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 5
        criteria:
          type: string
        imageUrl:
          type: string
        color:
          type: string
        categoryId:
          type: integer
        requiresProgress:
          type: boolean
        criteriaSections: {}
        criteriaType:
          type: string
          enum: [binary, numeric]

    BadgeUpdateInput:
      description: Same as BadgeInput but all fields optional, organizationId/createdBy never client-assignable
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 5
        criteria:
          type: string
        imageUrl:
          type: string
        color:
          type: string
        categoryId:
          type: integer
        requiresProgress:
          type: boolean
        criteriaSections: {}
        criteriaType:
          type: string
          enum: [binary, numeric]

    Achievement:
      description: Full Drizzle row (shared/schema.ts achievements table)
      type: object
      required:
        [
          id,
          userId,
          badgeId,
          status,
          awardedAt,
          awardedBy,
          createdAt,
          createdBy,
          updatedAt,
          updatedBy,
          active,
        ]
      properties:
        id:
          type: integer
        userId:
          type: integer
        badgeId:
          type: integer
        status:
          type: string
          enum: [in_progress, achieved]
        awardedAt:
          type: string
          format: date-time
          nullable: true
        awardedBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          nullable: true
        updatedAt:
