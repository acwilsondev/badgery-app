services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: badgery
      POSTGRES_PASSWORD: badgery
      POSTGRES_DB: badgery
    ports:
      - "5432:5432"
    volumes:
      - badgery-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badgery"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  badgery-postgres-data:
