name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: badgery
          POSTGRES_PASSWORD: badgery
          POSTGRES_DB: badgery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U badgery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: production bundle must not statically import dev-only vite
        run: |
          shopt -s nullglob
          files=(dist/index.js dist/chunk-*.js)
          if grep -l 'from "vite"' "${files[@]}"; then
            echo "static vite import leaked into the production entry or a shared chunk"
            exit 1
          fi
          echo "OK: no static vite import in the production bundle"
